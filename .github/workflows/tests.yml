# Runs the tests in tests/ on Windows, with the real ExifTool and the real window (offscreen).
# They run on every push to a branch other than main, and the release workflow runs them first:
# a new version is only built and published if every test passes.
name: Tests (Windows)

on:
  push:
    branches-ignore: [main]
    paths-ignore: ["README.md"]
  pull_request:
  workflow_dispatch:
  workflow_call:

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/exiftool
      - name: Install what the tests need
        run: python -m pip install -r requirements.txt pytest
      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python -m pytest -v -rs
