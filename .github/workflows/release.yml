# Builds the portable program on GitHub's own Windows and Mac machines.
# - Every push: the zips are kept as downloadable "artifacts" of that run (Actions tab).
# - A version tag (e.g. v2026.10.27): the zips are attached to a Release on the Releases page.
name: Build portable app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the latest ExifTool for Windows
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest "https://exiftool.org/ver.txt" -UseBasicParsing).Content.Trim()
          Write-Host "ExifTool $ver"
          $urls = @("https://exiftool.org/exiftool-${ver}_64.zip",
                    "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download")
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile exiftool.zip -UseBasicParsing -UserAgent "curl/8"; break }
            catch { Write-Host "Couldn't download from $u, trying the next source" }
          }
          Expand-Archive exiftool.zip -DestinationPath exiftool-download
          $exe = Get-ChildItem exiftool-download -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          if (-not $exe) { throw "ExifTool's .exe wasn't found in the download" }
          "EXIFTOOL=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the build tools
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build IPTC Tagger.exe
        shell: pwsh
        run: python build_standalone.py --out build-output --exiftool "$env:EXIFTOOL" --no-start
      - name: Check that the program starts
        shell: pwsh
        run: |
          $p = Start-Process "build-output\IPTC Tagger\IPTC Tagger.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "IPTC Tagger.exe closed by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "IPTC Tagger.exe started and stayed open"
      - uses: actions/upload-artifact@v4
        with:
          name: IPTC-Tagger-Windows
          path: build-output/IPTC Tagger (Windows).zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/IPTC Tagger (Windows).zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build IPTC Tagger.app
        run: python build_standalone.py --out build-output --no-start
      - uses: actions/upload-artifact@v4
        with:
          name: IPTC-Tagger-Mac
          path: build-output/IPTC Tagger (Mac).zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/IPTC Tagger (Mac).zip
