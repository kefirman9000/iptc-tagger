# Runs the tests first (tests.yml, on Windows): nothing is built or published unless they all pass.
# Then builds the portable Windows program on GitHub's own machines, and publishes it on the
# Releases page as "IPTC Tagger <version>" (the version comes from APP_VERSION in tagger_core.py).
# Pushing a new version number makes a new release; pushing again with the same number updates it.
name: Build portable app

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build that's still running, so an older build can't overwrite the release
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/exiftool
      - name: Install the build tools
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build IPTC Tagger.exe
        shell: pwsh
        run: python build_standalone.py --out build-output --exiftool "$env:EXIFTOOL" --no-start
      - name: Check that the program starts
        shell: pwsh
        run: |
          $p = Start-Process "build-output\IPTC Tagger\IPTC Tagger.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "IPTC Tagger.exe closed by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "IPTC Tagger.exe started and stayed open"
      - uses: actions/upload-artifact@v4
        with:
          name: IPTC-Tagger-Windows
          path: build-output/IPTC Tagger (Windows).zip
  release:
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version number
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"(.+?)\"', open('tagger_core.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Write the release notes (from CHANGELOG.md)
        run: |
          python3 - <<'PY'
          import os, sys
          sys.path.insert(0, ".")
          import tagger_core as core
          notes = dict(core.changelog_sections(open("CHANGELOG.md", encoding="utf-8").read())).get(os.environ["VERSION"], "")
          with open("release_notes.md", "w", encoding="utf-8") as f:
              f.write("**Windows:** download **IPTC.Tagger.Windows.zip**, unzip it and run **IPTC Tagger.exe**. ExifTool is included.  \n"
                      "Requires [Ollama](https://ollama.com/download) (free) for the AI.\n")
              if notes:
                  f.write("\n## What's new\n\n" + notes + "\n")
          PY
          cat release_notes.md
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: IPTC Tagger ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: release_notes.md
          files: zips/*.zip
