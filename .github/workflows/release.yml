# Builds the portable program on GitHub's own Windows and Mac machines, then publishes it on the
# Releases page as "IPTC Tagger <version>" (the version comes from APP_VERSION in tagger_core.py).
# Pushing a new version number makes a new release; pushing again with the same number updates it.
name: Build portable app

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:

permissions:
  contents: write

# a newer push replaces a build that's still running, so an older build can't overwrite the release
concurrency:
  group: release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the latest ExifTool for Windows
        shell: pwsh
        run: |
          $ver = (Invoke-WebRequest "https://exiftool.org/ver.txt" -UseBasicParsing).Content.Trim()
          Write-Host "ExifTool $ver"
          $urls = @("https://exiftool.org/exiftool-${ver}_64.zip",
                    "https://sourceforge.net/projects/exiftool/files/exiftool-${ver}_64.zip/download")
          foreach ($u in $urls) {
            try { Invoke-WebRequest $u -OutFile exiftool.zip -UseBasicParsing -UserAgent "curl/8"; break }
            catch { Write-Host "Couldn't download from $u, trying the next source" }
          }
          Expand-Archive exiftool.zip -DestinationPath exiftool-download
          $exe = Get-ChildItem exiftool-download -Recurse -Filter "exiftool*.exe" | Select-Object -First 1
          if (-not $exe) { throw "ExifTool's .exe wasn't found in the download" }
          "EXIFTOOL=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install the build tools
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build IPTC Tagger.exe
        shell: pwsh
        run: python build_standalone.py --out build-output --exiftool "$env:EXIFTOOL" --no-start
      - name: Check that the program starts
        shell: pwsh
        run: |
          $p = Start-Process "build-output\IPTC Tagger\IPTC Tagger.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "IPTC Tagger.exe closed by itself (exit code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Write-Host "IPTC Tagger.exe started and stayed open"
      - uses: actions/upload-artifact@v4
        with:
          name: IPTC-Tagger-Windows
          path: build-output/IPTC Tagger (Windows).zip
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the build tools
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build IPTC Tagger.app
        run: python build_standalone.py --out build-output --no-start
      - uses: actions/upload-artifact@v4
        with:
          name: IPTC-Tagger-Mac
          path: build-output/IPTC Tagger (Mac).zip

  release:
    # publish once both builds are done (or just Windows, if the Mac build had a problem)
    needs: [windows, mac]
    if: ${{ always() && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the version number
        run: |
          VERSION=$(python3 -c "import re;print(re.search(r'APP_VERSION = \"(.+?)\"', open('tagger_core.py').read()).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Version $VERSION"
      - uses: actions/download-artifact@v4
        with:
          path: zips
          merge-multiple: true
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: IPTC Tagger ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows:** download **IPTC.Tagger.Windows.zip**, unzip it and run **IPTC Tagger.exe**. ExifTool is included.
            **Mac:** download **IPTC.Tagger.Mac.zip** and open **IPTC Tagger.app** (first time: right-click → Open). Requires [ExifTool](https://exiftool.org).
            Requires [Ollama](https://ollama.com/download) (free) for the AI.
          files: zips/*.zip
